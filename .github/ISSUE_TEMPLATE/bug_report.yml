name: Bug Report
description: Report a problem with the provider
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Terraform Configuration
      description: The relevant provider/resource configuration (redact any secrets).
      render: terraform
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include any error messages or Terraform output.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Configure provider with ...
        2. Run `terraform apply`
        3. See error ...
    validations:
      required: true

  - type: input
    id: provider_version
    attributes:
      label: Provider Version
      placeholder: "e.g. 0.4.0"
    validations:
      required: true

  - type: input
    id: terraform_version
    attributes:
      label: Terraform Version
      placeholder: "e.g. 1.7.0"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or logs.
