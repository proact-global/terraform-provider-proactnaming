# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  pull_request:
    paths-ignore:
      - 'README.md'
  # Only main. Without a branch filter, pushing to a branch that has an open
  # pull request starts a second, identical run, and the two execute acceptance
  # tests against the same naming tool at the same time. The tool loses writes
  # when written concurrently, so the duplicate run silently deletes records the
  # first one had just created. Pull requests are covered by the trigger above.
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

# One run at a time for the whole repository.
#
# The acceptance tests write to a single shared naming tool which loses writes
# when written concurrently, so any two overlapping runs corrupt each other --
# whether they come from the same branch pushed twice or, more easily, from two
# open pull requests being tested at once.
#
# The group is deliberately a constant rather than the branch, because scoping
# it per branch would still allow separate pull requests to overlap, which is
# the common case whenever more than one is open.
#
# The cost is that unrelated runs queue behind each other, including the fast
# build and unit jobs. That is the price of the naming tool being shared mutable
# state; narrow it only if acceptance testing moves to a dedicated instance.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # We need the latest version of Terraform for our documentation generation to use
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  # Unit tests. These need no Azure Naming Tool instance and no credentials, so
  # they run on every push and pull request, including from forks. TF_ACC is
  # deliberately NOT set: that keeps the acceptance tests skipped here, leaving
  # this job to exercise the provider logic that can be tested in isolation.
  unit:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go test -v -cover ./...

  # Acceptance tests. These run against a real Azure Naming Tool instance and
  # create real records in it, so they are opt-in.
  #
  # To enable:
  #   1. Set the repository variable ACCEPTANCE_TESTS_ENABLED to "true".
  #   2. Configure the repository secrets PROACTNAMING_HOST, PROACTNAMING_APIKEY
  #      and PROACTNAMING_ADMIN_PASSWORD. PROACTNAMING_HOST must not end in a
  #      trailing slash.
  #
  # Note that ACCEPTANCE_TESTS_ENABLED is a repository *variable*, not a secret:
  # the secrets context is not available in job-level `if` conditions.
  #
  # The admin password is required, and not only for destroy: the provider
  # deletes its plan-time preview entry during plan, which is an Admin API call.
  #
  # With the variable unset the job does not run at all, rather than running and
  # skipping every test — a skipped acceptance suite is indistinguishable from a
  # passing one at a glance. If the job does run without credentials, the test
  # pre-check fails instead of skipping (see requireAccEnv in provider_test.go),
  # because GitHub Actions sets CI=true.
  acceptance:
    name: Acceptance Tests
    needs: build
    # Fork pull requests are excluded deliberately. GitHub withholds secrets from
    # them but still exposes repository variables, so without the fork check this
    # job would start with empty credentials, fail the pre-check (which is strict
    # under CI) and turn an outside contributor's pull request red through no
    # fault of their own.
    if: >-
      ${{ vars.ACCEPTANCE_TESTS_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Run one Terraform version at a time. The matrix jobs share a single
      # naming tool, and the tool stores generated names by reading the whole
      # collection, appending, and writing it all back, with no locking. Two
      # jobs writing at once therefore lose each other's changes: an entry one
      # job created disappears when another saves a snapshot taken before it
      # existed, and an entry one job deleted comes back when another saves a
      # snapshot that still contains it.
      #
      # That surfaced as acceptance failures in both directions at once --
      # names reported missing right after being created, and names reported
      # present right after being deleted -- which looked like a provider bug
      # and was not.
      max-parallel: 1
      # The provider claims support for Terraform >= 1.0, so test that floor and
      # the current release. Add specific versions here if a regression needs
      # pinning down.
      matrix:
        terraform:
          - '1.0.*'
          - '1.5.*'
          - 'latest'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - env:
          TF_ACC: "1"
          PROACTNAMING_HOST: ${{ secrets.PROACTNAMING_HOST }}
          PROACTNAMING_APIKEY: ${{ secrets.PROACTNAMING_APIKEY }}
          PROACTNAMING_ADMIN_PASSWORD: ${{ secrets.PROACTNAMING_ADMIN_PASSWORD }}
          # Component values the generated names are built from. These are part
          # of each naming tool's own configuration rather than credentials, so
          # they come from repository variables. Any left unset fall back to the
          # defaults in acceptance_config_test.go; set the ones your instance
          # disagrees with. A wrong value surfaces as "ResourceType value is
          # invalid." or similar, which reads like a provider bug but is not.
          PROACTNAMING_TEST_ORG: ${{ vars.PROACTNAMING_TEST_ORG }}
          PROACTNAMING_TEST_RESOURCE_TYPE: ${{ vars.PROACTNAMING_TEST_RESOURCE_TYPE }}
          PROACTNAMING_TEST_RESOURCE_TYPE_ALT: ${{ vars.PROACTNAMING_TEST_RESOURCE_TYPE_ALT }}
          PROACTNAMING_TEST_LOCATION: ${{ vars.PROACTNAMING_TEST_LOCATION }}
          PROACTNAMING_TEST_ENVIRONMENT: ${{ vars.PROACTNAMING_TEST_ENVIRONMENT }}
          PROACTNAMING_TEST_INSTANCE_WIDTH: ${{ vars.PROACTNAMING_TEST_INSTANCE_WIDTH }}
        run: go test -v -cover ./internal/provider/
        timeout-minutes: 10
